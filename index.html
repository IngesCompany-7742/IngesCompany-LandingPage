<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoofPlus centralizes quality documentation, batch traceability, deviations and IoT data for pharmaceutical laboratories in one platform.">
  <meta name="keywords" content="DoofPlus, pharmaceutical quality management, GMP, BPM, DIGEMID, batch traceability, IoT, audit trail, QA/QC, SaaS">
  <meta name="author" content="IngesCompany">
  <title data-i18n="meta.home">DoofPlus - Pharmaceutical Quality Management</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/assets/styles/main.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="nav.skip">Skip to main content</a>
<!-- Header: brand, section navigation, language switcher and segment access -->
<header class="navbar navbar-dark">
  <div class="container navbar-inner">
    <a href="#home" class="brand" style="color: var(--teal-bright); font-size: 24px; font-weight: 700; text-decoration: none;">DoofPlus</a>

    <nav class="nav-links" aria-label="Main">
      <a href="#" data-i18n="nav.platform"></a>
      <a href="#" data-i18n="nav.role"></a>
      <a href="#" data-i18n="nav.security"></a>
      <a href="#" data-i18n="nav.resources"></a>
    </nav>

    <div class="nav-actions">
      <div class="lang-switch lang-switch-dark" role="group" aria-label="Language">
        <button class="lang-btn active" type="button" data-lang="en">EN</button>
        <span style="color: #64748b; font-size: 12px; margin: 0 4px;">|</span>
        <button class="lang-btn" type="button" data-lang="es">ES</button>
      </div>
      <button class="btn btn-primary desktop-only" data-i18n="nav.qa_access"></button>
      <button class="btn btn-primary desktop-only" data-i18n="nav.prod_access"></button>
    </div>
  </div>
</header>
<main id="main">
  <!-- Hero: value proposition -->
  <section class="hero section-dark" id="home">
    <div class="container hero-grid">
      <div class="hero-content">
        <span class="overline overline-light" data-i18n="hero.overline"></span>
        <h1 data-i18n="hero.title"></h1>
        <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
        <div class="hero-buttons">
          <a href="#workspace" class="btn btn-primary btn-lg" data-i18n="hero.btn_signin"></a>
          <a href="#capabilities" class="btn btn-outline btn-lg" data-i18n="hero.btn_capabilities" style="border: 1px solid #64748b; color: white; background: transparent;"></a>        </div>        <p class="hero-trust" data-i18n="hero.trust"></p>
      </div>
      <div class="hero-visual">
        <img src="public/assets/images/pharmaceutical-laboratory.jpg" alt="Laboratorio" class="hero-img">
        <div class="floating-card">
          <span class="status-badge" data-i18n="hero.badge"></span>
          <p data-i18n="hero.badge_text"></p>
        </div>
      </div>
    </div>
  </section>
</main>
<!-- Plans with monthly / annual billing -->
<section class="section section-gray" id="plans">
  <div class="container">
    <div class="plans-head">
      <div>
        <span class="overline" data-i18n="plans.overline">Plans</span>
        <h2 data-i18n="plans.title">Simple plans for every laboratory</h2>
        <p class="section-subtitle" data-i18n="plans.subtitle"></p>
      </div>
      <div class="billing-toggle" role="group">
        <button type="button" class="active" data-billing="monthly" data-i18n="plans.monthly">Monthly</button>
        <button type="button" data-billing="annual" data-i18n="plans.annually">Annually · 2 months free</button>
      </div>
    </div>

    <div class="grid-2">
      <article class="plan-card">
        <h3 data-i18n="plans.standard_name">Standard Lab</h3>
        <p class="plan-desc" data-i18n="plans.standard_desc"></p>
        <p class="price"><strong data-price-monthly="US$199" data-price-annual="US$1,990">US$199</strong> <span data-period></span></p>
        <p class="price-note" data-note-monthly="plans.standard_note_monthly" data-note-annual="plans.standard_note_annual"></p>
        <ul class="plan-features">
          <li data-i18n="plans.standard_f1"></li>
          <li data-i18n="plans.standard_f2"></li>
          <li data-i18n="plans.standard_f3"></li>
          <li data-i18n="plans.standard_f4"></li>
        </ul>
        <a href="demo.html" data-magnetic class="btn btn-outline btn-block" data-i18n="plans.standard_cta">Get Standard Lab</a>
      </article>
      <article class="plan-card plan-featured">
        <div class="plan-title-row"><h3 data-i18n="plans.enterprise_name">Enterprise</h3><span class="plan-badge" data-i18n="plans.enterprise_badge">Most complete</span></div>
        <p class="plan-desc" data-i18n="plans.enterprise_desc"></p>
        <p class="price"><strong data-price-monthly="US$599" data-price-annual="US$5,990">US$599</strong> <span data-period></span></p>
        <p class="price-note" data-note-monthly="plans.enterprise_note_monthly" data-note-annual="plans.enterprise_note_annual"></p>
        <ul class="plan-features">
          <li data-i18n="plans.enterprise_f1"></li>
          <li data-i18n="plans.enterprise_f2"></li>
          <li data-i18n="plans.enterprise_f3"></li>
          <li data-i18n="plans.enterprise_f4"></li>
        </ul>
        <a href="demo.html" data-magnetic class="btn btn-white btn-block" data-i18n="plans.enterprise_cta">Get Enterprise</a>
      </article>
    </div>
    <p class="plans-note" data-i18n="plans.note"></p>
  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <img src="public/assets/images/doofplus-logo.png" alt="DoofPlus" class="brand-logo footer-logo">
        <p data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h4 data-i18n="footer.product">Product</h4>
        <a href="#features" data-i18n="footer.features"></a>
        <a href="#plans" data-i18n="footer.pricing"></a>
        <a href="#product" data-i18n="footer.how"></a>
      </div>
      <div>
        <h4 data-i18n="footer.company">Company</h4>
        <a href="#about" data-i18n="footer.about"></a>
        <a href="#team" data-i18n="footer.team"></a>
        <a href="#faq" data-i18n="footer.faq"></a>
      </div>
      <div>
        <h4 data-i18n="footer.contact">Contact</h4>
        <a href="mailto:doofplus.inges@gmail.com">doofplus.inges@gmail.com</a>
        <a href="tel:+5112345678">+51 (1) 234-5678</a>
        <span data-i18n="footer.location">Lima, Perú</span>
      </div>
      <div>
        <h4 data-i18n="footer.legal">Legal</h4>
        <a href="terms.html" class="underline" data-i18n="footer.terms"></a>
        <a href="privacy.html" class="underline" data-i18n="footer.privacy"></a>
      </div>
    </div>
    <div class="footer-bottom">
      <p data-i18n="footer.copyright"></p>
      <div class="footer-actions">
        <div class="lang-switch lang-switch-dark" role="group" aria-label="Language">
          <button class="lang-btn active" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="es">ES</button>
        </div>
        <a href="#" class="btn btn-dark" data-app-segment="qa" data-i18n="footer.qa_access">QA/QC Access</a>
        <a href="#" class="btn btn-dark" data-app-segment="production" data-i18n="footer.prod_access">Production Access</a>
      </div>
    </div>
  </div>
</footer>

<script type="module" src="public/assets/scripts/main.js"></script>
</body>
</html>
